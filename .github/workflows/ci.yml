# Every push and pull request: the same gates that are run by hand, on a clean
# Linux machine. The Docker tests here are also the platform's only regular
# run on Linux, where previews and deployments reach containers by address
# rather than through published ports.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  checks:
    name: Format, lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm --filter @platform/shared test
      - run: pnpm --filter @platform/web test

  api:
    name: API unit and integration tests (real PostgreSQL, MinIO, Redis, Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Start local infrastructure
        run: |
          pnpm infra:up
          docker compose --env-file .env -f infra/docker-compose.yml --profile queue up -d --wait redis
      - run: pnpm --filter @platform/shared build
      - run: pnpm db:deploy
      - run: pnpm db:generate
      - name: API tests
        env:
          TEST_DATABASE_NAME: platform_test
          DOCKER_SOCKET_PATH: /var/run/docker.sock
        run: pnpm --filter @platform/api test

  e2e:
    name: Browser tests (Playwright, real containers)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm infra:up
      - run: pnpm db:deploy
      - run: pnpm --filter @platform/e2e exec playwright install --with-deps chromium
      - name: Browser tests
        env:
          DOCKER_SOCKET_PATH: /var/run/docker.sock
        run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/test-results
          retention-days: 7

  images:
    name: Production images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build every production image
        run: |
          for target in api proxy backup; do
            docker buildx build --target "$target" --tag "platform-$target:ci" --load .
          done
      - name: Validate the production compose file
        run: |
          cp deploy/production.env.example deploy/production.env
          sed -i \
            -e 's/^SECRETS_ENCRYPTION_KEY=.*/SECRETS_ENCRYPTION_KEY=Y2ktb25seS1rZXktY2ktb25seS1rZXktY2ktb25seQ==/' \
            -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/' \
            -e 's/^USERDB_PASSWORD=.*/USERDB_PASSWORD=ci/' \
            -e 's/^STORAGE_SECRET_KEY=.*/STORAGE_SECRET_KEY=ci-only-secret/' \
            deploy/production.env
          docker compose --env-file deploy/production.env -f deploy/docker-compose.yml config --quiet

  security:
    name: Security scans (dependencies, secrets, images)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities in dependencies (fails on high or critical)
        run: pnpm audit --prod --audit-level=high
      - name: Secrets in the repository and its history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --config /repo/.gitleaks.toml --no-banner --redact
      - uses: docker/setup-buildx-action@v3
      - name: Known vulnerabilities in the production images (fails on critical)
        run: |
          for target in api proxy backup; do
            docker buildx build --target "$target" --tag "platform-$target:scan" --load .
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
              image --quiet --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1 "platform-$target:scan"
          done
